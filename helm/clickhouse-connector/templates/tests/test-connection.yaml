apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "clickhouse-connector.fullname" . }}-test-connection"
  labels:
    {{- include "clickhouse-connector.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: busybox:1.37.0
      command: ['wget']
      args: ['-q', '-O', '/dev/null', '{{ include "clickhouse-connector.fullname" . }}:{{ .Values.service.port }}']
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      resources:
        limits:
          cpu: 100m
          memory: 32Mi
        requests:
          cpu: 10m
          memory: 16Mi
  restartPolicy: Never
