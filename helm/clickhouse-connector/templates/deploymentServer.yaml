apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "clickhouse-connector.fullname" . }}-server
  labels:
    {{- include "clickhouse-connector.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.serverReplicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "clickhouse-connector.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "clickhouse-connector.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "clickhouse-connector.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [ "/sbin/clickhouse-connector",
                     "-mode","server",
                     "-maxBodyBytes","{{ int64 .Values.config.maxBodyBytes }}",
                     "-redisServer", "{{ include "clickhouse-connector.redisFullname" . }}:6379" ]
          env:
            - name: AUTH_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "clickhouse-connector.secretName" . }}
                  key: auth-key
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "clickhouse-connector.secretName" . }}
                  key: redis-password
          ports:
            - name: http
              containerPort: 6000
              protocol: TCP
            - name: metrics
              containerPort: 6001
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
