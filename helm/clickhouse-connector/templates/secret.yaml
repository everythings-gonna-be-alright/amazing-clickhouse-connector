{{- $secretName := include "clickhouse-connector.secretName" . -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName).data | default dict -}}
{{- $redisPassword := .Values.config.redis.password | default (index $existing "redis-password" | default "" | b64dec) | default (randAlphaNum 32) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "clickhouse-connector.labels" . | nindent 4 }}
type: Opaque
data:
  auth-key: {{ include "clickhouse-connector.authKeys" . | b64enc | quote }}
  clickhouse-password: {{ .Values.config.clickhouse.password | default "" | b64enc | quote }}
  redis-password: {{ $redisPassword | b64enc | quote }}
