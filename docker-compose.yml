services:
  server:
    build:
      context: .
    entrypoint: ["/sbin/clickhouse-connector",
                 "-mode", "server",
                 "-redisServer", "redis:6379"]
    environment:
      AUTH_KEY: local-dev-auth-key-only
    ports:
      - 127.0.0.1:6000:6000
    depends_on:
      - redis

  consumer:
    build:
      context: .
    entrypoint: ["/sbin/clickhouse-connector",
                 "-mode", "consumer",
                 "-redisServer", "redis:6379",
                 "-clickhouseServer", "clickhouse:9000",
                 "-clickhouseUsername", "connector",
                 "-clickhouseDatabaseName", "clickhouse_connector",
                 "-clickhouseClusterName", "",
                 "-clickhouseBatchSize", "1",
                 "-columnTypesConfig", "{\"connection_type\":\"String\",\"ts\":\"String\"}"]
    environment:
      CLICKHOUSE_PASSWORD: local-dev-password-only
    depends_on:
      - redis
      - clickhouse

  clickhouse:
    image: clickhouse/clickhouse-server:26.8.36.3@sha256:d426d2f612e1e189c90f9a3f8dcd85a03c6851273833817a296bb327e63aa7a7
    environment:
      CLICKHOUSE_DB: clickhouse_connector
      CLICKHOUSE_USER: connector
      CLICKHOUSE_PASSWORD: local-dev-password-only
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "0"
    ports:
      - 127.0.0.1:8123:8123
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  redis:
    image: valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
    ports:
      - 127.0.0.1:6379:6379
